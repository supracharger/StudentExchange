<text x="1110" y="363.96" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="middle">[no]</text>
<rect x="44" y="333" width="268" height="135" rx="5" fill="#FFF4CD" stroke="none" stroke-width="1"/>
<text x="58" y="356.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Window extension</text>
<text x="58" y="381.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">At multiples &gt; 10: max(expiry, now)</text>
<text x="58" y="401.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">+ 5 min × max(count / 10 − 2, 1). IP</text>
<text x="58" y="421.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">blocks do not revoke user tokens.</text>
