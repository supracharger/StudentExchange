<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
<title>D19 | Website session state machine</title>
<desc>UML state machine • adapter session validity and backend token validity are separate. Adapter sessions expire after 12 hours, are not sliding, and disappear on a Node process restart.</desc>
