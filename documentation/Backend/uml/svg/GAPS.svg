<text x="62" y="518.13" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#65788A" text-anchor="start">RUNTIME LIMIT</text>
<text x="228" y="522.11" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Session scope &amp; database constraints</text>
<text x="228" y="549.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">One Node instance; sessions lost on restart. Account FK enforcement is not explicitly enabled by Sql connections.</text>
