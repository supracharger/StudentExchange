<text x="62" y="298.13" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#65788A" text-anchor="start">PREVIEW</text>
<text x="228" y="302.11" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Marketplace interactions</text>
<text x="228" y="329.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Sample listing array; messages and offers only update App state. No seller delivery or durable conversations.</text>
