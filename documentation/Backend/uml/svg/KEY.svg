<polyline points="585.0,321.0 595,316 585.0,311.0" fill="none" stroke="#65788A" stroke-width="1.5"/>
<text x="635" y="300.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Client uses supplier; arrow points toward supplier.</text>
<text x="410" y="390.45" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Generalization</text>
<polyline points="415,415 595,415" fill="none" stroke="#65788A" stroke-width="1.5"/>
<polygon points="595,415 585.0,420.0 585.0,410.0" fill="#FFFFFF" stroke="#65788A" stroke-width="1"/>
<text x="635" y="399.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Specialized type points to its parent type.</text>
<text x="410" y="489.45" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Realization</text>
