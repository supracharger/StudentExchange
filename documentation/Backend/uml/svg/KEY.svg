<text x="75" y="289.96" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">+ operation(arg : Type) : Result</text>
<rect x="65" y="406" width="290" height="148" rx="5" fill="#EAF3FB" stroke="none" stroke-width="1"/>
<text x="79" y="429.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Class compartments</text>
<text x="79" y="454.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Name, attributes and operations; +</text>
<text x="79" y="474.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">public, - private. «static» and</text>
<text x="79" y="494.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">«interface» identify intent.</text>
<text x="410" y="192.45" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Association</text>
