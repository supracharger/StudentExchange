<text x="56" y="657.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">An association is not automatically composition; relational foreign keys do not establish object ownership.</text>
<text x="44" y="697.3" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#65788A" text-anchor="start">Reference: UML (1).pdf, pp. 8–14 (use cases), 15–43 (classes), 60 (deployment), 74–81 (architecture)</text>
<text x="1238" y="697.3" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#65788A" text-anchor="end">03</text>
