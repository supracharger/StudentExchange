<polygon points="595,514 585.0,519.0 585.0,509.0" fill="#FFFFFF" stroke="#65788A" stroke-width="1"/>
<text x="635" y="498.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Implementation points to its interface contract.</text>
<text x="410" y="597.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#65788A" text-anchor="start">Sequence: time descends; dashed arrows return. Activity: guards use [condition].</text>
