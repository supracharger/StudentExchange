<polyline points="960,175 960,280" fill="none" stroke="#18334B" stroke-width="1.5"/>
<text x="940" y="202.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="middle">Dn</text>
<text x="975" y="199.62" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#18334B" text-anchor="start">Data store</text>
<text x="975" y="222.96" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Persistent or session data</text>
<text x="65" y="354.94" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Arrow labels name payloads or records. Each process has an input and output.</text>
<text x="65" y="381.04" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">There are no direct entity-to-store or store-to-store flows.</text>
<text x="65" y="407.14000000000004" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Store IDs repeat across sheets; SQL stores group tables by responsibility.</text>
<text x="65" y="433.24000000000007" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">F00 process 0 expands into F01 processes 1.0 and 2.0.</text>
<text x="65" y="459.3400000000001" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">F02–F07 decompose 2.0; F08 decomposes 1.0.</text>
<text x="65" y="485.4400000000001" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">For legibility, unchanged routing/session checks and lookup reads are abstracted.</text>
<text x="65" y="511.54000000000013" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">The scheduler is internal; timing is not drawn as an external data entity.</text>
<text x="65" y="574.79" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#18334B" text-anchor="start">Source: f893267d148fc0c3c6fad8bee5caadf6c086a143 (not a verification of deployed production behavior).</text>
